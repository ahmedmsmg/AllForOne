# Builds ready-to-run archives for every OS and GPU kind and attaches them to a GitHub release.
# Push a tag like v0.2.0 to publish; install.sh and install.ps1 download from the latest release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Release archives don't need debug info; it triples the binaries' size.
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: symbols
  BINS: afo afo-node afo-client afo-probe afo-plan afo-monitor
  PACKAGES: -p afo -p afo-node -p afo-client -p afo-plan -p afo-monitor

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { asset: linux-x86_64-cpu, os: ubuntu-22.04 }
          - { asset: linux-aarch64-cpu, os: ubuntu-22.04-arm }
          - { asset: macos-arm64-metal, os: macos-15, features: "--features afo/metal,afo-node/metal,afo-client/metal,afo-plan/metal" }
          - { asset: macos-x86_64-cpu, os: macos-15-intel }
          - { asset: windows-x86_64-cpu, os: windows-2022 }
    steps:
      - uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: cargo build --release --locked $PACKAGES ${{ matrix.features }}

      - name: Package
        shell: bash
        run: |
          mkdir -p pkg dist
          if [ "$RUNNER_OS" = Windows ]; then
            for b in $BINS; do cp "target/release/$b.exe" pkg/; done
            (cd pkg && 7z a "../dist/afo-${{ matrix.asset }}.zip" . >/dev/null)
          else
            for b in $BINS; do cp "target/release/$b" pkg/; done
            tar -C pkg -czf "dist/afo-${{ matrix.asset }}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  build-cuda:
    name: cuda
    strategy:
      fail-fast: false
      matrix:
        # The kernels only compute correctly on the compute capability they were built for (a
        # 7.5 build runs on an 8.6 card but gives wrong results), so there is one build per GPU
        # generation: 75 RTX 20 / GTX 16, 80 A100, 86 RTX 30, 89 RTX 40, 90 H100, 120 RTX 50.
        cap: ["75", "80", "86", "89", "90", "120"]
        platform: [linux, windows]
        include:
          # candle's kernels define half-precision helpers that CUDA 12.4+ also defines for
          # pre-Ampere GPUs, so 7.5 builds with CUDA 12.0. On Windows, MSVC's STL rejects CUDA
          # older than 12.4 unless told to allow the mismatch.
          - { cap: "75", cuda: "12.0.1" }
          - { platform: windows, cap: "75", nvcc_flags: "-allow-unsupported-compiler -D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH" }
    uses: ./.github/workflows/cuda-build.yml
    with:
      platform: ${{ matrix.platform }}
      cap: ${{ matrix.cap }}
      cuda: ${{ matrix.cuda || '12.8.1' }}
      nvcc_flags: ${{ matrix.nvcc_flags || '' }}

  # Publishes whatever built: a failed GPU build shouldn't hold back the rest (the installers
  # fall back to the CPU build). Not on a cancelled run, which would publish a partial release.
  publish:
    needs: [build, build-cuda]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
