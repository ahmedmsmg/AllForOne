[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
afo-proto = { path = "crates/proto" }
afo-codec = { path = "crates/codec" }
afo-engine = { path = "crates/engine" }
afo-client = { path = "crates/client" }
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
codegen-units = 1
lto = "thin"
