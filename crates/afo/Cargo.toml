[package]
name = "afo"
version.workspace = true
edition.workspace = true

[features]
cuda = ["afo-engine/cuda", "afo-plan/cuda", "afo-client/cuda"]
metal = ["afo-engine/metal", "afo-plan/metal", "afo-client/metal"]

[dependencies]
afo-proto.workspace = true
afo-codec.workspace = true
afo-engine.workspace = true
afo-client.workspace = true
afo-plan = { path = "../plan" }
afo-monitor = { path = "../monitor" }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["process", "signal", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
